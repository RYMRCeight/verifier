<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mayor's Office Document Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        background: linear-gradient(135deg, #e6f0ff, #f8fbff);
        font-family: system-ui, sans-serif;
    }

    .marquee {
        white-space: nowrap;
        overflow: hidden;
        position: relative;
    }

    .marquee span {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 15s linear infinite;
    }

    @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
    }
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div class="max-w-md w-full bg-white shadow-2xl rounded-2xl border border-blue-500">

    <!-- HEADER -->
    <div class="bg-blue-700 text-white text-center p-5 rounded-t-2xl">
        <h1 class="text-lg font-bold tracking-wide">
            MAYOR'S OFFICE DOCUMENT VERIFICATION PORTAL
        </h1>
        <p class="text-sm opacity-90 mt-1">
            Local Government Unit of Tangalan, Aklan
        </p>
    </div>

    <!-- BODY -->
    <div class="p-6 space-y-4 text-sm">

        <div>
            <span class="font-semibold text-gray-500">Document Name/Number</span>
            <div id="ref" class="text-lg font-bold text-gray-900"></div>
        </div>

        <div>
            <span class="font-semibold text-gray-500">Released By</span>
            <div id="by" class="text-gray-900"></div>
        </div>

        <div>
            <span class="font-semibold text-gray-500">Date & Time Released</span>
            <div id="date" class="text-gray-900"></div>
        </div>

        <div id="noRecord" class="pt-4 border-t text-center hidden">
    <span class="inline-flex items-center gap-2 text-red-600 font-semibold">
        ✖ No Records Found
    </span>
</div>
        
     <div id="statusBox" class="pt-4 border-t text-center hidden">
    <span class="inline-flex items-center gap-2 text-blue-700 font-semibold">
        ✔ Status: Officially Released
    </span>
</div>


    </div>

    <!-- FOOTER -->
    <div class="bg-blue-50 text-blue-700 text-xs py-3 rounded-b-2xl border-t">
        <div class="marquee font-semibold">
            <span>Bugna it Tangalan • Bugna it Tangalan • Bugna it Tangalan •</span>
        </div>
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);

    const ref = params.get('ref');
    const by = params.get('by');
    const date = params.get('date');

    const refBox = document.getElementById('ref');
    const byBox = document.getElementById('by');
    const dateBox = document.getElementById('date');
    const statusBox = document.getElementById('statusBox');
    const noRecord = document.getElementById('noRecord');

    refBox.textContent = ref || '—';
    byBox.textContent = by || '—';
    dateBox.textContent = date || '—';

    // REQUIRE ALL fields
    if (ref && by && date) {
        statusBox.classList.remove('hidden');
        noRecord.classList.add('hidden');
    } else {
        statusBox.classList.add('hidden');
        noRecord.classList.remove('hidden');
    }
</script>

</body>
</html>
